name: CI Build

on:
  push:
    branches: [ "master" ]

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: true

    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v3.2.1
      with:
        versionSpec: '6.3.x'
              
    - name: Determine Version
      id: version_step # step id used as a reference for output values
      uses: gittools/actions/gitversion/execute@v3.2.1

    - name: Display GitVersion variables
      run: |
        echo "FullSemVer (env.fullSemVer)    : ${{ env.fullSemVer }}"
        echo "SemVer (env.semVer)            : ${{ env.semVer }}"

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Install third party notices tool
      run: dotnet tool install --global ThirdLicense
      continue-on-error: true
      
    - name: Generate third party notices
      run: thirdlicense --project  ./Cygnus.BLE.API/Cygnus.BLE.API.csproj --output ./THIRD-PARTY-NOTICES.txt
      continue-on-error: true

    - name: Build
      run: dotnet build -c Release --no-restore /p:Version=${{ env.fullSemVer }}

    - name: Test
      run: dotnet test -c Release --no-build --verbosity normal --logger trx --collect:"XPlat Code Coverage"
      
    - name: Code Coverage Report
      uses: irongut/CodeCoverageSummary@v1.3.0
      with:
        filename: coverage/**/coverage.cobertura.xml
        badge: true
        fail_below_min: true
        format: markdown
        hide_branch_rate: false
        hide_complexity: true
        indicators: true
        output: both
        thresholds: '60 80'

    - name: Add Coverage PR Comment
      uses: marocchino/sticky-pull-request-comment@v2
      if: github.event_name == 'pull_request'
      with:
        recreate: true
        path: code-coverage-results.md

    - name: Pack
      run: dotnet pack -c Release --no-restore --no-build /p:Version=${{ env.fullSemVer }}

    - name: Connect to Cygnus packages in GitHub
      run: dotnet nuget add source --username c49nu5 --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/c49nu5/index.json"

    - name: Publish
      run: dotnet nuget push **/bin/Release/*.nupkg --api-key ${{ secrets.GITHUB_TOKEN }}  --source "github"
